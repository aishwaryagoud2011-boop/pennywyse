    <script>
      if (window.location.protocol !== 'file:') {
        var mLink = document.createElement('link');
        mLink.rel = 'manifest';
        mLink.href = './manifest.webmanifest';
        document.head.appendChild(mLink);
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div class="app-outer">
        <div class="app-shell">
          <div class="boot-loader">
            <span class="spinner" style="width:32px;height:32px;border-width:3px;color:#A80F0F;"></span>
            <p class="font-serif" style="font-size:14px;color:#525252;">Loading Pennywyse...</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        if (window.location.protocol !== 'file:' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var hadLegacy = false;
            var tasks = [];
            for (var i = 0; i < regs.length; i++) {
              var reg = regs[i];
              var url = (reg.active && reg.active.scriptURL) || (reg.waiting && reg.waiting.scriptURL) || (reg.installing && reg.installing.scriptURL) || '';
              if (url.indexOf('dev-sw.js') !== -1) {
                hadLegacy = true;
                tasks.push(reg.unregister());
              }
            }
            if (hadLegacy) {
              Promise.all(tasks).then(function () {
                if ('caches' in window) {
                  caches.keys().then(function (keys) {
                    Promise.all(keys.map(function (k) { return caches.delete(k); })).then(function () {
                      if (!sessionStorage.getItem('pw_sw_reloaded')) {
                        sessionStorage.setItem('pw_sw_reloaded', '1');
                        window.location.reload();
                      }
                    });
                  });
                }
              });
            }
          }).catch(function () {});
        }
      })();
    </script>
    <script defer src="./js/state.js"></script>

    <script defer src="./js/finance.js"></script>

    <script defer src="./js/screens/home.js"></script>
    <script defer src="./js/screens/transactions.js"></script>
    <script defer src="./js/screens/analytics.js"></script>
    <script defer src="./js/screens/ai.js"></script>
    <script defer src="./js/screens/profile.js"></script>
    <script defer src="./js/app.js"></script>
  </body>
